version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch/minor drift is noise one PR at a time; batch it.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Majors arrive as individual PRs so each gets its own review.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
